<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7effb"/>
      <stop offset="100%" stop-color="#eadcf4"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a2a82"/>
      <stop offset="100%" stop-color="#2c1646"/>
    </linearGradient>
    <filter id="softDrop" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a1442" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#deskBg)"/>
  <circle cx="510" cy="110" r="105" fill="#f2547d" opacity="0.14"/>
  <circle cx="130" cy="340" r="120" fill="#5a2a82" opacity="0.10"/>

  <!-- Botanical leaves (Left) -->
  <path d="M105 350 C105 260 85 200 68 155" stroke="#2f6f7e" stroke-width="4" stroke-linecap="round"/>
  <path d="M98 280 C65 265 55 235 80 220 C105 235 110 262 98 280 Z" fill="#2f6f7e" opacity="0.85"/>
  <path d="M90 225 C120 212 132 182 106 168 C82 185 78 210 90 225 Z" fill="#3f8a9b" opacity="0.85"/>
  <rect x="82" y="340" width="46" height="44" rx="10" fill="#f2547d"/>

  <!-- Desk surface line -->
  <rect x="52" y="380" width="536" height="12" rx="6" fill="#d9c6e8"/>

  <!-- Laptop -->
  <g filter="url(#softDrop)">
    <rect x="172" y="132" width="296" height="200" rx="16" fill="#1d1a2f"/>
    <rect x="184" y="144" width="272" height="174" rx="10" fill="#ffffff"/>
    <!-- UI layout on laptop screen -->
    <rect x="196" y="156" width="84" height="150" rx="8" fill="url(#screenGrad)"/>
    <circle cx="238" cy="196" r="20" fill="#f2547d"/>
    <rect x="212" y="228" width="52" height="8" rx="4" fill="#ffffff"/>
    <rect x="218" y="244" width="40" height="6" rx="3" fill="#cdb5e4"/>
    <rect x="210" y="264" width="56" height="20" rx="10" fill="#f2547d"/>

    <rect x="292" y="156" width="152" height="68" rx="8" fill="#f4edf9"/>
    <rect x="304" y="170" width="88" height="9" rx="4.5" fill="#5a2a82"/>
    <rect x="304" y="186" width="124" height="7" rx="3.5" fill="#a89bc0"/>
    <rect x="304" y="200" width="96" height="7" rx="3.5" fill="#a89bc0"/>

    <rect x="292" y="234" width="71" height="72" rx="8" fill="#fce8ee"/>
    <rect x="373" y="234" width="71" height="72" rx="8" fill="#e6f2f5"/>
    <circle cx="327" cy="264" r="14" fill="#f2547d"/>
    <circle cx="408" cy="264" r="14" fill="#2f6f7e"/>
    <!-- Laptop base -->
    <path d="M138 334 H502 L520 356 C524 362 518 370 510 370 H130 C122 370 116 362 120 356 Z" fill="#dfd3eb"/>
    <rect x="276" y="340" width="88" height="8" rx="4" fill="#bca7d1"/>
  </g>

  <!-- Coffee Mug (Right) -->
  <g filter="url(#softDrop)">
    <rect x="502" y="316" width="52" height="64" rx="12" fill="#5a2a82"/>
    <path d="M554 330 h10 c7 0 12 6 12 13 s-5 13 -12 13 h-10" stroke="#5a2a82" stroke-width="6" fill="none"/>
    <path d="M518 302 c0-7 6-8 6-14 M534 300 c0-7 6-8 6-14" stroke="#f2547d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating UI Pill -->
  <g filter="url(#softDrop)">
    <rect x="410" y="76" width="170" height="48" rx="24" fill="#ffffff"/>
    <circle cx="436" cy="100" r="12" fill="#22a06b" opacity="0.18"/>
    <circle cx="436" cy="100" r="6" fill="#22a06b"/>
    <rect x="458" y="92" width="96" height="7" rx="3.5" fill="#1d1a2f"/>
    <rect x="458" y="104" width="68" height="5" rx="2.5" fill="#8b829d"/>
  </g>
</svg>
